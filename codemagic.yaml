workflows:
  android-debug:
    name: Android APK Debug
    max_build_duration: 30
    instance_type: mac_mini_m2

    environment:
      flutter: 3.44.9
      java: 17

    scripts:
      - name: Crear proyecto Flutter base limpio
        script: |
          # Crear proyecto base con flutter create (genera android/ completo y correcto)
          flutter create --org com.example --project-name whatsapp_webview /tmp/wa_base
          
          # Reemplazar lib/ con nuestro código
          rm -rf /tmp/wa_base/lib
          cp -rf lib /tmp/wa_base/lib
          
          # Reemplazar pubspec.yaml con el nuestro
          cp pubspec.yaml /tmp/wa_base/pubspec.yaml
          
          # Reemplazar AndroidManifest con el nuestro
          cp android/app/src/main/AndroidManifest.xml \
             /tmp/wa_base/android/app/src/main/AndroidManifest.xml
          
          # Reemplazar MainActivity con el nuestro
          cp android/app/src/main/kotlin/com/example/whatsapp_webview/MainActivity.kt \
             /tmp/wa_base/android/app/src/main/kotlin/com/example/whatsapp_webview/MainActivity.kt
          
          # Copiar XMLs de recursos
          cp android/app/src/main/res/xml/file_paths.xml \
             /tmp/wa_base/android/app/src/main/res/xml/file_paths.xml 2>/dev/null || \
             (mkdir -p /tmp/wa_base/android/app/src/main/res/xml && \
              cp android/app/src/main/res/xml/file_paths.xml \
                 /tmp/wa_base/android/app/src/main/res/xml/file_paths.xml)
          
          cp android/app/src/main/res/xml/network_security_config.xml \
             /tmp/wa_base/android/app/src/main/res/xml/network_security_config.xml 2>/dev/null || \
             (mkdir -p /tmp/wa_base/android/app/src/main/res/xml && \
              cp android/app/src/main/res/xml/network_security_config.xml \
                 /tmp/wa_base/android/app/src/main/res/xml/network_security_config.xml)
          
          # Movernos al proyecto base
          cd /tmp/wa_base

      - name: Instalar dependencias
        script: |
          cd /tmp/wa_base
          flutter pub get

      - name: Compilar APK
        script: |
          cd /tmp/wa_base
          flutter build apk --debug --no-tree-shake-icons

    artifacts:
      - /tmp/wa_base/build/app/outputs/flutter-apk/app-debug.apk

    publishing:
      email:
        recipients:
          - andresu34t@gmail.com
        notify:
          success: true
          failure: true
