name: Build APK

on:
  push:
    branches: [ main ]
  workflow_dispatch:

jobs:
  build-android:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout código
        uses: actions/checkout@v4

      - name: Configurar Java 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Configurar Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.22.0'
          channel: 'stable'
          cache: true

      - name: Deshabilitar plataformas no Android
        run: |
          flutter config --no-enable-ios
          flutter config --no-enable-web
          flutter config --no-enable-linux-desktop
          flutter config --no-enable-macos-desktop
          flutter config --no-enable-windows-desktop

      - name: Crear local.properties
        run: |
          echo "flutter.sdk=$(flutter --version --machine | python3 -c "import sys,json; print(json.load(sys.stdin).get('flutterRoot',''))" 2>/dev/null || dirname $(dirname $(which flutter)))" > android/local.properties
          echo "sdk.dir=$ANDROID_SDK_ROOT" >> android/local.properties
          cat android/local.properties

      - name: Crear gradlew ejecutable
        run: |
          cd android
          if [ ! -f gradlew ]; then
            gradle wrapper --gradle-version=8.3
          fi
          chmod +x gradlew

      - name: Instalar dependencias Flutter
        run: flutter pub get

      - name: Compilar APK debug
        run: flutter build apk --debug --no-tree-shake-icons --target-platform android-arm,android-arm64

      - name: Subir APK
        uses: actions/upload-artifact@v4
        with:
          name: wa-client-apk
          path: build/app/outputs/flutter-apk/app-debug.apk
          retention-days: 30

      - name: Tamaño del APK
        run: ls -lh build/app/outputs/flutter-apk/app-debug.apk
